services:
  database:
    image: mariadb:12.0
    environment:
      MARIADB_DATABASE: freezer_demo
      MARIADB_USER: freezer_demo
      MARIADB_PASSWORD: freezer_demo_local
      MARIADB_ROOT_PASSWORD: root_demo_local
    volumes:
      - demo_database:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: freezer_demo
      DB_USER: freezer_demo
      DB_PASSWORD: freezer_demo_local
    depends_on:
      database:
        condition: service_healthy

volumes:
  demo_database:

